<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Âncora · Conversas</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0f8f82;--teal-d:#0a6b62;--teal-l:#d7f0ec;--teal-xl:#eaf7f5;
  --rail:#0a0e0f;--bg:#f3f6f6;--panel:#fff;--panel2:#f7faf9;--ink:#0f1f1e;--mute:#6b7c7a;--line:#e3ebea;
  --bubble-in:#fff;--bubble-out:linear-gradient(135deg,#12a091,#0a7468);--wall:#eef3f2;--shadow:0 1px 2px rgba(10,40,36,.06),0 8px 24px rgba(10,40,36,.06);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1213;--panel:#131a1b;--panel2:#182122;--ink:#e8f2f0;--mute:#8aa09d;--line:#233031;--bubble-in:#1b2627;--wall:#0f1516;--teal-l:#12332f;--teal-xl:#10282a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1213;--panel:#131a1b;--panel2:#182122;--ink:#e8f2f0;--mute:#8aa09d;--line:#233031;--bubble-in:#1b2627;--wall:#0f1516;--teal-l:#12332f;--teal-xl:#10282a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:76px 380px 1fr;height:100%;max-width:1680px;margin:0 auto}

/* rail */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:6px}
.rail .logo{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;margin-bottom:18px}
.rail .logo svg{width:30px;height:30px;stroke:#0a0e0f;stroke-width:1.9}
.rail button{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#7f9390;position:relative;transition:background .2s,color .2s}
.rail button:hover{background:#182021;color:#fff}
.rail button.on{background:var(--teal);color:#fff}
.rail button.on::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--teal)}
.rail .dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:#ff6b5e;border:2px solid var(--rail)}
.rail .sp{flex:1}

/* list */
.list{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lhead{padding:20px 20px 12px;display:flex;align-items:center;justify-content:space-between}
.brand h1{font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--teal)}
.brand p{font-size:12px;color:var(--mute);margin-top:2px}
.lhead .acts{display:flex;gap:10px}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--teal-xl);color:var(--teal);transition:transform .15s,background .2s}
.ibtn:hover{background:var(--teal-l)}.ibtn:active{transform:scale(.94)}
.ibtn.solid{background:var(--teal);color:#fff;box-shadow:0 6px 16px rgba(15,143,130,.35)}
.ibtn.solid:hover{background:var(--teal-d)}
.search{margin:4px 20px 12px;display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:44px;color:var(--mute)}
.search svg{width:18px;height:18px}
.search input{flex:1;border:0;background:none;outline:0;color:var(--ink);font:inherit;font-size:14px;height:100%}
.search:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}
.chips{display:flex;gap:8px;padding:0 20px 14px;overflow-x:auto;scrollbar-width:none}
.chip{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--mute);white-space:nowrap;transition:.2s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.convs{flex:1;overflow-y:auto;padding:0 10px 14px}
.conv{display:flex;gap:13px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:16px;transition:background .15s}
.conv:hover{background:var(--panel2)}
.conv.on{background:var(--teal-xl);box-shadow:inset 3px 0 0 var(--teal)}
.av{position:relative;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none}
.av i{position:absolute;right:0;bottom:1px;width:13px;height:13px;border-radius:50%;background:#2fd27a;border:2.5px solid var(--panel)}
.conv.on .av i{border-color:var(--teal-xl)}
.cm{flex:1;min-width:0}
.cm .r1,.cm .r2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cm b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm time{font-size:12px;color:var(--mute);flex:none}
.cm .r2{margin-top:3px}
.cm p{font-size:13.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm p.me::before{content:"Tu: ";color:var(--teal);font-weight:600}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--teal);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px;flex:none}
.conv.unread b{font-weight:800}.conv.unread p{color:var(--ink);font-weight:500}.conv.unread time{color:var(--teal);font-weight:600}
.none{text-align:center;color:var(--mute);font-size:14px;padding:40px 20px}

/* chat */
.chat{
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
  background:var(--wall);
  position:relative
}
.chat::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.5;
  pointer-events:none;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);
  background-size:22px 22px
}
.chead{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 22px;
  background:var(--panel);
  border-bottom:1px solid var(--line)
}
.back{display:none}
.chead .av{width:46px;height:46px}.chead .av i{border-color:var(--panel)}
.chead .who{flex:1;min-width:0}
.chead .who b{display:block;font-size:16px;font-weight:700}
.chead .who span{font-size:12.5px;color:var(--teal);font-weight:500}
.chead .who span.typing{font-style:italic}
.chead .tools{display:flex;gap:4px}
.chead .tools button{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--mute)}
.chead .tools button:hover{background:var(--panel2);color:var(--teal)}
.msgs{position:relative;z-index:1;flex:1;overflow-y:auto;padding:22px clamp(14px,5vw,64px);display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth}
.day{align-self:center;font-size:12px;font-weight:600;color:var(--mute);background:var(--panel);border:1px solid var(--line);padding:5px 14px;border-radius:999px;margin:10px 0}
.m{max-width:min(520px,78%);padding:10px 14px 8px;border-radius:18px;font-size:14.5px;line-height:1.5;box-shadow:var(--shadow);position:relative;animation:pop .22s ease-out;overflow-wrap:anywhere}
.m small{display:flex;justify-content:flex-end;gap:4px;font-size:11px;margin-top:3px;opacity:.7}
.m.in{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:6px}
.m.out{align-self:flex-end;background:var(--bubble-out);color:#fff;border-bottom-right-radius:6px}
.m.gap{margin-top:10px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.audio{display:flex;align-items:center;gap:10px;min-width:210px}
.audio .play{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center}
.audio .play svg{width:16px;height:16px;fill:currentColor;stroke:none}
.audio .wave{flex:1;height:26px;display:flex;align-items:center;gap:2px}
.audio .wave s{width:3px;border-radius:2px;background:var(--mute);opacity:.55}
.dots{align-self:flex-start;display:flex;gap:4px;padding:13px 16px;background:var(--bubble-in);border-radius:18px;border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.dots s{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.dots s:nth-child(2){animation-delay:.15s}.dots s:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}

/* composer */
.comp{position:relative;z-index:2;padding:12px clamp(14px,5vw,64px) 16px;display:flex;align-items:flex-end;gap:10px}
.box{flex:1;display:flex;align-items:flex-end;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:6px 8px;box-shadow:var(--shadow)}
.box:focus-within{border-color:var(--teal)}
.box button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex:none}
.box button:hover{color:var(--teal);background:var(--teal-xl)}
.box textarea{flex:1;border:0;background:none;outline:0;resize:none;font:inherit;font-size:14.5px;color:var(--ink);padding:9px 4px;max-height:120px;line-height:1.4}
.send{width:50px;height:50px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(15,143,130,.35);transition:transform .15s,background .2s;flex:none}
.send:hover{background:var(--teal-d)}.send:active{transform:scale(.93)}
.emojis{position:absolute;bottom:74px;left:clamp(14px,5vw,64px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;display:none;grid-template-columns:repeat(6,1fr);gap:2px;box-shadow:var(--shadow)}
.emojis.open{display:grid;animation:pop .18s}
.emojis button{font-size:22px;width:40px;height:40px;border-radius:10px}.emojis button:hover{background:var(--teal-xl)}
.empty{margin:auto;text-align:center;position:relative;z-index:1;padding:20px}
.empty svg{width:84px;height:84px;color:var(--teal);stroke-width:1.2}
.empty h2{font-size:24px;color:var(--teal);margin:12px 0 6px;font-weight:800}
.empty p{color:var(--mute);font-size:14px}

@media (max-width:1060px){.app{grid-template-columns:68px 320px 1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{flex-direction:row;justify-content:space-around;padding:6px;order:3;position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);z-index:20}
  .rail .logo,.rail .sp{display:none}.rail button.on::before{display:none}
  .list,.chat{grid-column:1;grid-row:1;padding-bottom:62px}
  .chat{display:none}
  .app.open .list{display:none}.app.open .chat{display:flex;padding-bottom:0}
  .app.open .rail{display:none}
  .back{display:grid}
  .m{max-width:86%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Navegação">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M12 7.2V21M8 11h8M4 14c0 4 3.5 7 8 7s8-3 8-7M4 14l-1.5 2M20 14l1.5 2"/></svg></div>
    <button class="on" aria-label="Conversas"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.2-4.6A8 8 0 1 1 21 12Z"/></svg><span class="dot"></span></button>
    <button aria-label="Loja"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg></button>
    <button aria-label="Estatísticas"><svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9"/></svg></button>
    <button aria-label="Cursos"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H4zM2 20h20M10 8.5l4 2-4 2z"/></svg></button>
    <span class="sp"></span>
    <button id="theme" aria-label="Alternar tema"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg></button>
    <button aria-label="Perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></button>
  </nav>

  <aside class="list">
    <div class="lhead">
      <div class="brand"><h1>Âncora</h1><p>Cláudio Avelino · Dev Tech</p></div>
      <div class="acts">
        <button class="ibtn" aria-label="Notificações"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1 1 12 0v6l1.5 2h-15L6 17ZM10 21h4"/></svg></button>
        <button class="ibtn solid" aria-label="Nova conversa"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Pesquisar conversas" autocomplete="off"></label>
    <div class="chips" id="chips">
      <button class="chip on" data-f="all">Todos</button>
      <button class="chip" data-f="unread">Não lidas</button>
      <button class="chip" data-f="private">Privado</button>
      <button class="chip" data-f="blocked">Bloqueado</button>
    </div>
    <div class="convs" id="convs"></div>
  </aside>

  <main class="chat" id="chat"></main>
</div>

<script>
(function(){
  var colors=["#0f8f82","#6a5acd","#d9822b","#c2456b","#2f7fd1","#4f9d3a","#8a5a44"];
  var C=[
    {id:1,n:"Marcelinus",on:1,t:"08:58",u:2,tag:"",m:[["in","Bom dia! Viste o novo catálogo de cursos?","08:41"],["in","Aldair já confirmou a reunião de hoje.","08:58"]]},
    {id:2,n:"Cláudio Avelino",on:1,t:"19:53",u:0,tag:"private",m:[["out","Já subi a nova versão da plataforma.","19:40"],["in","Perfeito. Vou testar o checkout agora.","19:46"],["in","__audio__","19:53"]]},
    {id:3,n:"Elvis Sangala",on:1,t:"21:58",u:1,tag:"",m:[["out","Boa noite, tudo certo com o pedido?","21:50"],["in","Calmo, e aí?","21:58"]]},
    {id:4,n:"Francis Brança",on:1,t:"20:07",u:0,tag:"",m:[["in","Podes enviar o link da loja?","20:02"],["out","Claro, ancora-ecommerce-tawny.vercel.app","20:05"],["in","Obrigado!","20:07"]]},
    {id:5,n:"Alberto Da Cruz Bambi",on:0,t:"14:57",u:0,tag:"private",m:[["in","Falamos amanhã sobre o projecto.","14:57"]]},
    {id:6,n:"Elvis",on:1,t:"20:00",u:0,tag:"",m:[["in","Elvis aqui. Preciso de ajuda com o curso de React.","19:58"],["out","Diz-me onde estás bloqueado.","20:00"]]},
    {id:7,n:"Valdimiro Capita",on:1,t:"00:19",u:3,tag:"",m:[["in","Estás em casa?","00:17"],["in","Tenho uma ideia para o módulo de pagamentos.","00:19"]]},
    {id:8,n:"Spam Promo",on:0,t:"Ontem",u:0,tag:"blocked",m:[["in","Oferta imperdível, clica aqui.","Ontem"]]}
  ];
  var cur=null,filter="all",query="",el=function(i){return document.getElementById(i)};
  var $c=el("convs"),$chat=el("chat"),$app=el("app");
  var ini=function(n){return n.split(" ").slice(0,2).map(function(w){return w[0]}).join("").toUpperCase()};
  var avatar=function(c,dot){var a=document.createElement("div");a.className="av";a.style.background=colors[c.id%colors.length];a.textContent=ini(c.n);if(dot&&c.on){a.appendChild(document.createElement("i"))}return a};
  var ico=function(d){return '<svg viewBox="0 0 24 24">'+d+'</svg>'};
  var now=function(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)};

  function last(c){return c.m[c.m.length-1]}
  function renderList(){
    $c.textContent="";
    var items=C.filter(function(c){
      var f=filter==="all"?c.tag!=="blocked":filter==="unread"?c.u>0:c.tag===filter;
      return f&&c.n.toLowerCase().indexOf(query)>-1;
    });
    if(!items.length){var d=document.createElement("div");d.className="none";d.textContent="Nenhuma conversa encontrada.";$c.appendChild(d);return}
    items.forEach(function(c){
      var b=document.createElement("button");b.className="conv"+(cur===c.id?" on":"")+(c.u?" unread":"");
      var l=last(c),txt=l[1]==="__audio__"?"Mensagem de voz":l[1];
      var m=document.createElement("div");m.className="cm";
      m.innerHTML='<div class="r1"><b></b><time></time></div><div class="r2"><p></p></div>';
      m.querySelector("b").textContent=c.n;m.querySelector("time").textContent=c.t;
      var p=m.querySelector("p");p.textContent=txt;if(l[0]==="out")p.className="me";
      if(c.u){var g=document.createElement("span");g.className="badge";g.textContent=c.u;m.querySelector(".r2").appendChild(g)}
      b.appendChild(avatar(c,1));b.appendChild(m);
      b.onclick=function(){open(c.id)};$c.appendChild(b);
    });
  }
  function bubble(x,gap){
    var d=document.createElement("div");d.className="m "+x[0]+(gap?" gap":"");
    if(x[1]==="__audio__"){
      var w="";[8,14,10,20,12,22,9,16,24,11,18,8,14,20,10,15].forEach(function(h){w+='<s style="height:'+h+'px"></s>'});
      d.innerHTML='<div class="audio"><span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span><span class="wave">'+w+'</span><span style="font-size:12px;opacity:.7">0:14</span></div>';
    }else{d.appendChild(document.createTextNode(x[1]))}
    var s=document.createElement("small");s.textContent=x[2]+(x[0]==="out"?" ✓✓":"");d.appendChild(s);return d;
  }
  function renderChat(){
    var c=C.filter(function(x){return x.id===cur})[0];
    $chat.textContent="";
    if(!c){
      $chat.innerHTML='<div class="empty">'+ico('<circle cx="12" cy="5" r="2.2"/><path d="M12 7.2V21M8 11h8M4 14c0 4 3.5 7 8 7s8-3 8-7M4 14l-1.5 2M20 14l1.5 2"/>')+'<h2>Âncora Ecommerce</h2><p>Escolhe uma conversa para começar a falar.</p></div>';return;
    }
    var h=document.createElement("header");h.className="chead";
    h.innerHTML='<button class="ibtn back" aria-label="Voltar">'+ico('<path d="m15 5-7 7 7 7"/>')+'</button>';
    h.querySelector(".back").onclick=function(){cur=null;$app.classList.remove("open");renderList();renderChat()};
    h.appendChild(avatar(c,1));
    var w=document.createElement("div");w.className="who";w.innerHTML='<b></b><span id="st"></span>';
    w.querySelector("b").textContent=c.n;w.querySelector("span").textContent=c.on?"Online agora":"Visto por último hoje";h.appendChild(w);
    var t=document.createElement("div");t.className="tools";
    t.innerHTML='<button aria-label="Chamada de voz">'+ico('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2Z"/>')+'</button><button aria-label="Pesquisar na conversa">'+ico('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/>')+'</button><button aria-label="Mais">'+ico('<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>')+'</button>';
    h.appendChild(t);$chat.appendChild(h);
    var ms=document.createElement("div");ms.className="msgs";ms.id="msgs";
    var dy=document.createElement("div");dy.className="day";dy.textContent="Hoje";ms.appendChild(dy);
    c.m.forEach(function(x,i){ms.appendChild(bubble(x,i>0&&c.m[i-1][0]!==x[0]))});
    $chat.appendChild(ms);
    var cp=document.createElement("div");cp.className="comp";
    cp.innerHTML='<div class="emojis" id="em"></div><div class="box"><button id="eb" aria-label="Emojis">'+ico('<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/>')+'</button><button aria-label="Anexar">'+ico('<path d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.3 3.3 0 0 1 4.7 4.7L9.5 17a1.7 1.7 0 0 1-2.4-2.4L14 7.7"/>')+'</button><textarea id="in" rows="1" placeholder="Escreve uma mensagem"></textarea></div><button class="send" id="sd" aria-label="Enviar">'+ico('<path d="M4 12 20 4l-4 16-4-6-8-2Z"/>')+'</button>';
    $chat.appendChild(cp);
    var em=el("em");["😀","😂","😍","👍","🙏","🔥","🎉","💯","😎","🤝","❤️","👏"].forEach(function(e){var b=document.createElement("button");b.textContent=e;b.onclick=function(){ta.value+=e;ta.focus()};em.appendChild(b)});
    var ta=el("in");
    el("eb").onclick=function(){em.classList.toggle("open")};
    ta.oninput=function(){ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,120)+"px"};
    ta.onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
    el("sd").onclick=send;
    ms.scrollTop=ms.scrollHeight;
  }
  function open(id){
    cur=id;var c=C.filter(function(x){return x.id===id})[0];c.u=0;
    $app.classList.add("open");renderList();renderChat();
    if(window.innerWidth>820)el("in").focus();
  }
  var replies=["Combinado! 👍","Já vejo isso e digo-te algo.","Boa ideia, vamos avançar.","Recebido, obrigado!","Perfeito, falamos já a seguir."];
  function send(){
    var ta=el("in"),v=ta.value.trim();if(!v)return;
    var c=C.filter(function(x){return x.id===cur})[0],ms=el("msgs"),id=cur;
    var x=["out",v,now()];c.m.push(x);c.t=x[2];
    ms.appendChild(bubble(x,c.m.length>1&&c.m[c.m.length-2][0]!=="out"));
    ta.value="";ta.style.height="auto";el("em").classList.remove("open");ms.scrollTop=ms.scrollHeight;renderList();
    if(!c.on)return;
    var st=el("st");st.textContent="a escrever…";st.className="typing";
    var d=document.createElement("div");d.className="dots";d.innerHTML="<s></s><s></s><s></s>";ms.appendChild(d);ms.scrollTop=ms.scrollHeight;
    setTimeout(function(){
      var r=["in",replies[Math.floor(Math.random()*replies.length)],now()];c.m.push(r);c.t=r[2];
      if(cur===id){d.remove();ms.appendChild(bubble(r,1));ms.scrollTop=ms.scrollHeight;st.textContent="Online agora";st.className=""}
      else c.u++;
      renderList();
    },1400);
  }
  el("q").oninput=function(e){query=e.target.value.toLowerCase().trim();renderList()};
  el("chips").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;
    [].forEach.call(document.querySelectorAll(".chip"),function(x){x.classList.remove("on")});b.classList.add("on");filter=b.dataset.f;renderList()};
  el("theme").onclick=function(){var r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);r.dataset.theme=d?"light":"dark"};
  renderList();renderChat();
})();
</script>
