[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ancorashield"
version = "0.2.0"
description = "Biblioteca de criptografia defensiva e proteção de APIs Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "jwcrypto>=1.5.6",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
flask = ["Flask>=3.0"]
database = ["SQLAlchemy>=2.0"]
dev = ["pytest>=8.0", "Flask>=3.0", "SQLAlchemy>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ancorashield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
