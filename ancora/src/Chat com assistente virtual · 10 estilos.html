.t{font-size:10.5px;opacity:.55;margin:4px 6px 0}.me .t{text-align:right}

.dur{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}

.ib{width:44px;height:44px;border-radius:var(--ir2);border:0;cursor:pointer;display:grid;place-items:center;transition:.25s;flex:none}
.send{background:var(--acc);color:var(--ai)}
.mic{background:rgba(127,127,127,.22);color:inherit}

.ib:hover{transform:scale(1.08)}.ib:active{transform:scale(.93)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.fx{display:block;width:100%;height:0;flex:0 0 0;opacity:0;transition:opacity .6s ease}
.audio .fx{flex:1 1 0;height:auto;min-height:0;opacity:1}

@keyframes fade{from{opacity:0}}

function loop(ms){
  t=ms/1000;
  if(chat.classList.contains("audio")&&W>0&&H>20){
    const tg=sp?0.3+0.3*(Math.sin(t*9)*.5+.5)*(.6+.4*Math.sin(t*3.1))+pulse*.4:0.04+0.03*Math.sin(t*2);
    lv+=(tg-lv)*.15;pulse*=.9;
    cx.clearRect(0,0,W,H);cx.save();cx.fillStyle=cx.strokeStyle=col;cx.shadowColor=col;cx.shadowBlur=0;
    D3[(+document.body.dataset.t||1)-1](cx,W/2,H/2,Math.min(W,H)*.26,Math.min(1,lv*1.4));
    cx.restore();
  }
  requestAnimationFrame(loop);
}

names.forEach((n,i)=>{const b=document.createElement("button");b.className="th";b.textContent=(i+1)+" · "+n;b.onclick=()=>setTheme(i+1);th.append(b)});
function setTheme(i){document.body.dataset.t=i;col=getComputedStyle(document.body).getPropertyValue("--acc").trim()||"#fff";[...th.children].forEach((b,k)=>b.classList.toggle("on",k==i-1));th.children[i-1].scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})}
setTheme(matchMedia("(prefers-color-scheme:dark)").matches?1:2);

const kb=[
[/olá|ola|oi\b|bom dia|boa tarde|boa noite/i,"Olá! Que bom falar contigo. Em que posso ajudar hoje?"],
[/serviç|fazem|oferec|trabalh/i,"Criamos sites, lojas online, sistemas de gestão e aplicações móveis, sempre com acompanhamento depois da entrega."],
[/preço|valor|custa|orçamento|quanto/i,"O valor depende do tamanho do projeto. Diz-me o que precisas e preparo uma proposta personalizada."],
[/horário|hora|abre|atendimento/i,"Atendemos de segunda a sexta, das 8h às 18h, hora de Luanda."],
[/voz|áudio|audio|falar|microfone/i,"Escolhe Áudio no topo e eu respondo em voz alta. Também podes tocar no microfone e falar comigo."],
[/contacto|contato|whatsapp|telefone|email/i,"Deixa-me o teu nome e número que a equipa entra em contacto contigo ainda hoje."],
[/obrigad|valeu|ótimo|otimo/i,"De nada! Se precisares de mais alguma coisa, estou aqui."]];
const answer=t=>{const k=kb.find(([r])=>r.test(t));return k?k[1]:"Boa pergunta! Posso encaminhar-te para um membro da equipa. Queres deixar o teu contacto?"};

if(SS){const pick=()=>{const v=SS.getVoices();voice=v.find(x=>/pt-PT/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||null};pick();SS.onvoiceschanged=pick}
function say(text,el,done){
  if(!SS){done&&done();return}
  SS.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang=voice?voice.lang:"pt-PT";if(voice)u.voice=voice;u.rate=1.02;
  const on=f=>{sp=f;el&&el.classList.toggle("talk",f);chat.classList.toggle("speaking",f);st.textContent=f?"A falar…":"Online"};
  u.onstart=()=>on(true);u.onboundary=()=>{pulse=1};u.onend=u.onerror=()=>{on(false);done&&done()};
  SS.speak(u);
}
function add(role){
  const m=document.createElement("div");m.className="m "+role;
  const b=document.createElement("div");b.className="b";
  const t=document.createElement("div");t.className="t";t.textContent=new Date().toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
  m.append(b,t);msgs.append(m);msgs.scrollTop=msgs.scrollHeight;return b;
}
function typeWrite(b,text){
  b.textContent="";b.classList.add("typing");let i=0;
  const id=setInterval(()=>{b.textContent=text.slice(0,++i);msgs.scrollTop=msgs.scrollHeight;
    if(i>=text.length){clearInterval(id);b.classList.remove("typing");st.textContent="Online"}},16);
}
function voiceBubble(b,text){
  const bars=Array.from({length:28},(_,i)=>`<i style="--h:${30+Math.abs(Math.sin(i*1.7)*70)|0}%;--d:${(i*.06).toFixed(2)}s"></i>`).join("");
  const s=Math.max(2,Math.round(text.length/15));
  b.innerHTML=`<div class="v"><button type="button" class="pl" aria-label="Ouvir">${PLAY}</button><div class="wv">${bars}</div><span class="dur">0:${String(s).padStart(2,"0")}</span></div><button type="button" class="vt">Ver texto</button><div class="tx"></div>`;
  const tx=b.querySelector(".tx"),v=b.querySelector(".v"),pl=b.querySelector(".pl"),vt=b.querySelector(".vt");
  tx.textContent=text;
  const play=()=>{pl.innerHTML=STOP;say(text,v,()=>{pl.innerHTML=PLAY})};
  pl.onclick=()=>v.classList.contains("talk")?SS.cancel():play();
  vt.onclick=()=>{tx.classList.toggle("show");vt.textContent=tx.classList.contains("show")?"Ocultar texto":"Ver texto"};
  play();
}
function bot(text){
  const b=add("bot");b.innerHTML='<div class="dots"><i></i><i></i><i></i></div>';st.textContent="A escrever…";
  setTimeout(()=>mode==="audio"?voiceBubble(b,text):typeWrite(b,text),700+Math.random()*500);
}
function send(text){
  text=text.trim();if(!text)return;
  SS&&SS.cancel();
  add("me").textContent=text;bot(answer(text));
}
$("#f").onsubmit=e=>{e.preventDefault();const v=input.value;input.value="";send(v)};
["Que serviços oferecem?","Quanto custa?","Qual o horário?","Como falo por voz?"].forEach(q=>{const b=document.createElement("button");b.textContent=q;b.onclick=()=>send(q);$("#chips").append(b)});
$("#mode").onclick=e=>{
  const m=e.target.dataset.m;if(!m||m===mode)return;
  mode=m;chat.classList.toggle("audio",m==="audio");SS&&SS.cancel();
  [...$("#mode").children].forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  bot(m==="audio"?"Modo áudio ativo. Agora falo contigo em voz alta e podes usar o microfone.":"Modo texto ativo. Voltamos a conversar por escrito.");
};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
mic.onclick=()=>{
  if(!SR){bot("O reconhecimento de voz não funciona neste navegador. Experimenta o Chrome ou escreve a mensagem.");return}
  if(rec){rec.stop();return}
  SS&&SS.cancel();
  rec=new SR();rec.lang="pt-PT";rec.interimResults=true;mic.classList.add("on");
  rec.onresult=e=>{const r=e.results[e.results.length-1];input.value=r[0].transcript;if(r.isFinal){const v=input.value;input.value="";send(v)}};
  rec.onend=rec.onerror=()=>{mic.classList.remove("on");rec=null};
  rec.start();
};
bot("Olá! Sou a Ana, a tua assistente virtual. Podes falar comigo por texto ou por áudio, escolhe no topo. Como posso ajudar?");
