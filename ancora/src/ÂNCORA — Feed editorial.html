<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ÂNCORA — Feed editorial</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,400&family=Inter:wght@300;400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#FAF9F6;--surface:#fff;--surface-2:#F6F3EF;--border:#E8E6E1;--border-strong:#D6D3CD;--text:#111110;--text-muted:#6B6B6B;--text-faint:#A8A6A0;--hot:#FF3B30;--sh:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);--lift:0 2px 8px rgba(0,0,0,.06),0 16px 40px rgba(0,0,0,.06);--ease:cubic-bezier(.16,1,.3,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F0F0E;--surface:#181816;--surface-2:#20201D;--border:#2B2A27;--border-strong:#3C3B37;--text:#F3F0EA;--text-muted:#A5A29B;--text-faint:#6E6C66;--hot:#FF5A50}}
:root[data-theme=dark]{--bg:#0F0F0E;--surface:#181816;--surface-2:#20201D;--border:#2B2A27;--border-strong:#3C3B37;--text:#F3F0EA;--text-muted:#A5A29B;--text-faint:#6E6C66;--hot:#FF5A50}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:35}
*{font-family:'Inter',system-ui,-apple-system,sans-serif;letter-spacing:-.02em}
.serif{font-family:'Instrument Serif','Newsreader',Georgia,serif;letter-spacing:-.03em}
.serif-italic{font-family:'Instrument Serif',Georgia,serif;font-style:italic}
.news{font-family:'Newsreader',Georgia,serif}
::selection{background:#FFE066;color:#111110}
*::-webkit-scrollbar{width:5px;height:5px}*::-webkit-scrollbar-thumb{background:var(--text);border-radius:999px}*::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.paper-noise::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.025;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.tr-400{transition:all .4s var(--ease)}.tr-300{transition:all .3s var(--ease)}
.image-zoom{transition:transform .8s var(--ease)}.group:hover .image-zoom{transform:scale(1.02)}
.label-caps{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--text-faint)}
.divider{height:1px;background:var(--border);width:100%}
.glass{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px)}.chipw{background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(8px)}
.ink{background:var(--text);color:var(--bg)}.ink:hover{opacity:.88}
@keyframes sheet-in{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}@keyframes fade-in{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="min-h-screen w-full overflow-x-clip bg-[var(--bg)] text-[var(--text)] paper-noise antialiased pb-[72px] lg:pb-0">
<header class="sticky z-30 glass border-b border-[var(--border)]" style="top:env(safe-area-inset-top,0px)">
<div class="mx-auto max-w-[1600px] flex h-[60px] items-center justify-between px-6 sm:px-8">
<div class="flex items-center gap-8"><h1 class="serif text-[22px] font-[700] tracking-[-0.04em] leading-none">ÂNCORA</h1><nav id="nav" class="hidden md:flex items-center gap-6" aria-label="Principal"></nav></div>
<div class="flex items-center gap-3"><div class="hidden sm:flex items-center gap-2 h-[32px] rounded-full bg-[var(--surface)] border border-[var(--border)] px-3 focus-within:border-[var(--text)] tr-300"><span class="text-[var(--text-faint)]" id="si"></span><input data-f="q" aria-label="Pesquisar no arquivo" placeholder="Pesquisar no arquivo" class="bg-transparent outline-none text-[12px] w-[160px] placeholder:text-[var(--text-faint)]"></div><button data-a="tab" data-v="estudio" id="hav" aria-label="Estúdio" class="h-8 w-8 rounded-full overflow-hidden bg-[var(--text)]"></button></div>
</div></header>
<div class="mx-auto max-w-[1600px] grid grid-cols-12 gap-0 sm:gap-8 px-0 sm:px-8 py-0 sm:py-10 relative z-10">
<aside id="left" class="col-span-12 lg:col-span-3 order-2 lg:order-1"></aside>
<main id="main" class="col-span-12 lg:col-span-6 order-1 lg:order-2 min-w-0"></main>
<aside id="right" class="col-span-12 lg:col-span-3 order-3"></aside>
</div>
<div id="modal"></div><div id="story"></div>
<div id="chat" class="fixed inset-y-0 right-0 z-[60] w-full sm:w-[420px] bg-[var(--bg)] border-l border-[var(--border)] shadow-[-16px_0_64px_rgba(0,0,0,0.08)] flex flex-col tr-400 translate-x-full" aria-label="Mensagens">
<div class="h-[60px] border-b border-[var(--border)] flex items-center justify-between px-6"><p class="label-caps">MENSAGENS • ESTÚDIO</p><button data-a="chat" data-v="0" aria-label="Fechar mensagens" class="h-8 w-8 rounded-full ink grid place-items-center tr-300" id="cx"></button></div>
<div class="flex flex-1 overflow-hidden"><div id="cl" class="w-[120px] border-r border-[var(--border)] p-3 space-y-2 bg-[var(--surface)] overflow-y-auto"></div>
<div class="flex-1 flex flex-col bg-[var(--bg)] min-w-0"><div id="ch" class="h-[56px] border-b border-[var(--border)] flex items-center gap-3 px-4 bg-[var(--surface)]"></div><div id="cm" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
<div class="p-3 border-t border-[var(--border)] flex gap-2 bg-[var(--surface)]"><input data-f="chat" id="ci" aria-label="Mensagem" placeholder="Escreve..." class="flex-1 min-w-0 h-10 rounded-full border border-[var(--border)] bg-[var(--bg)] px-4 text-[13px] outline-none focus:border-[var(--text)] tr-300"><button data-a="csend" aria-label="Enviar" id="cs" class="h-10 w-10 rounded-full ink grid place-items-center tr-300"></button></div></div></div></div>
<nav id="tab" class="lg:hidden fixed bottom-0 inset-x-0 z-30 glass border-t border-[var(--border)]" style="padding-bottom:env(safe-area-inset-bottom,0px)" aria-label="Principal"></nav>
<div id="toasts" class="fixed left-6 z-[90] flex flex-col gap-2 max-w-[320px]" style="bottom:calc(24px + env(safe-area-inset-bottom,0px))" role="status" aria-live="polite"></div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',plus:'<path d="M5 12h14M12 5v14"/>',pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',arr:'<path d="M7 7h10v10M7 17 17 7"/>',chk:'<path d="M20 6 9 17l-5-5"/>',load:'<path d="M21 12a9 9 0 1 1-6.2-8.6"/>',send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',at:'<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>',img:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'};
const ic=(n,s=14,c='')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${c}" aria-hidden="true">${IC[n]}</svg>`;
/* Ilustrações editoriais 4:3 geradas (as fotos externas não carregam numa página alojada) */
const PAL=[['#1a1a18','#8b6f55','#f0d9b5','#111110','#2b2723'],['#cfc7ba','#f0ede8','#e0a96d','#6b6558','#4a463e'],['#dde0d6','#f4f1ea','#d96a4a','#5f6f5a','#3f4d3d'],['#2a3b52','#e9b88f','#fbe3b5','#1d2736','#121a26'],['#e8e6e1','#d8c3a5','#c2553a','#8a6a4f','#5c4532'],['#111110','#3a4a5a','#e8e6e1','#0a0a09','#1f2a33']],AC={};
const art=i=>AC[i]||(AC[i]=(()=>{const p=PAL[i%6],k=i%4;let g='';
if(k==0)for(let j=0;j<11;j++){const h=80+(j*67+i*29)%170;g+=`<rect x='${j*76-10}' y='${600-h}' width='64' height='${h}' fill='${j%2?p[3]:p[4]}'/>`}
else if(k==1)g=`<rect y='380' width='800' height='220' fill='${p[3]}'/>`+[0,1,2,3].map(j=>`<rect x='${100+j*37}' y='${400+j*40}' width='${600-j*74}' height='3' fill='${p[2]}' opacity='${.5-j*.1}'/>`).join('');
else if(k==2)g=`<path d='M0 430Q200 330 400 430T800 400V600H0Z' fill='${p[4]}'/><path d='M0 500Q250 400 500 500T800 470V600H0Z' fill='${p[3]}'/>`;
else g=`<path d='M250 600V330a150 150 0 0 1 300 0V600Z' fill='${p[3]}'/><circle cx='400' cy='300' r='46' fill='${p[4]}'/>`;
return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'><defs><linearGradient id='a' x2='0' y2='1'><stop stop-color='${p[0]}'/><stop offset='1' stop-color='${p[1]}'/></linearGradient></defs><rect width='800' height='600' fill='url(#a)'/><circle cx='${230+i*41%340}' cy='${190+i*17%70}' r='64' fill='${p[2]}' opacity='.92'/>${g}</svg>`)})());
addEventListener('error',e=>{const t=e.target;if(t.tagName=='IMG'&&!t.dataset.f){t.dataset.f=1;t.src=art(+t.dataset.s||0)}},true);
const im=(src,i,c,alt='')=>`<img src="${src?esc(src):art(i)}" data-s="${i}" alt="${esc(alt||'Âncora editorial')}" class="${c}" loading="lazy">`;
const LB=['Luanda Skyline','Estúdio Tech','Moda Lifestyle','Praia Angola','Criativos','Fotografia Editorial','Café Estúdio','Retrato Minimal','Âncora 1','Âncora 2','Âncora 3','Âncora 4','Âncora 5','Âncora 6','Âncora 7','Âncora 8'];
const U=Object.fromEntries([['u0','Tu — Estúdio','Editor'],['u1','Kwame Ndombaxi','Fotografia'],['u2','Luena Capitão','Moda'],['u3','Rafael M. Silva','Tecnologia'],['u4','Nádia Fortunato','Gastronomia'],['u5','Josué Tchissingui','Negócios'],['u6','Maya Correia','Cinema']].map(([id,name,role])=>[id,{id,name,role}]));
const BIO='Founder @Âncora • Produto & cultura angolana. Escrevo sobre o cotidiano de Luanda com o rigor de um arquivo.';
const MP=[
['p1','u1','Manhã de hoje na Ilha — luz das 6h','Fiz este ensaio com a comunidade de pescadores — três gerações na mesma canoa. A água estava a 24°C, visibilidade absurda. Quem já mergulhou aqui antes do trabalho?',0,'Ilha de Luanda, Luanda',324,42,12,'2h'],
['p2','u3','Kilapi Pay v2 — edge em Luanda','Lançámos ontem a v2 com PIX + Multicaixa Express no mesmo checkout, reconciliação automática e webhooks tipados. A latência caiu 67% com edge em Luanda.',1,'Luanda, AO',189,23,44,'4h'],
['p3','u2','Upcycling de panos africanos','Coleção nova com denim japonês selvedge. 100% feita por costureiras do Cazenga com corte zero-waste. Votei, mas quero ouvir o arquivo.',2,'Atelier Cazenga',512,89,7,'6h'],
['p4','u4','Mufete reinventado — funge e dendê','Funge de bombó com molho de moqueca baiana e peixe grelhado na lenha de eucalipto. Segredo? Tostar o fuba no dendê antes da água.',3,'',412,67,34,'9h'],
['p5','u6','Deserto do Namibe, 17:43 — sem filtro','Sem drone — deixei propositadamente em casa. O silêncio aqui faz reset neurológico completo. Voltar a Luanda com arquivo limpo.',4,'Deserto do Namibe',721,102,88,'12h'],
['p6','u5','1 milhão de transações no Kilapi','Obrigado a cada vendedor da Roque que confiou quando éramos só 2 numa sala sem AC. Próximo passo: crédito para microempreendedores.',5,'',445,39,56,'1d'],
['p7','u1','Retrato da manhã — estúdio no Miramar','Café preto, papel algodão 120gsm, luz natural. Imprimimos ontem 12 provas em grande formato. O grão do filme segura a sombra melhor que o digital.',6,'Miramar, Luanda',298,21,9,'1d'],
['p8','u2','Processo — corte zero-waste','Cada metro de pano rende 2 peças. O resto vira ecobag. Fotografamos com luz lateral para ver a textura do selvedge.',7,'Cazenga',334,31,14,'1d'],
['p9','u6','Praia da Ilha — mar sem edição','Cheguei às 5:30. Não há guarda-sol, só pescadores e mar. Fiz tudo em 35mm, sem crop. Às vezes a melhor câmera é esperar.',8,'Ilha, Luanda',601,54,23,'2d'],
['p10','u4','Atelier aberto — cheiro de dendê','Receita de mufete com twist de moqueca. Testamos com peixe grelhado e vinagrete de jinguba. Quem vem provar sexta?',9,'Luanda',278,19,11,'2d'],
['p11','u3','Edge computing em Luanda — bastidores','Instalámos POP no backbone da Angola Cables. Ping médio de 12ms para Lisboa. Documentação aberta no GitHub da Kilapi.',10,'Luanda Tech Park',412,44,67,'3d'],
['p12','u5','Roque Santeiro — arquivo vivo','Cada banca é uma startup sem pitch deck. Fotografei 3 horas sem parar. O arquivo de Luanda está na rua, não no cloud.',11,'Roque Santeiro',523,71,39,'3d']
].map(([id,u,title,text,i,loc,likes,cc,sh,t])=>({id,u,title,text,i,loc,likes,liked:false,cc,sh,t,q:'Qual paleta para o drop?',poll:id=='p3'?[['Terracota + Indigo profundo',312],['Verde musgo + Cru natural',189],['Preto + Rosa queimado',94]]:null}));
const TR=[['LuandaNoMapa','Fotografia','12.4k','A luz das 6h na Ilha — um arquivo coletivo'],['KilapiPay','Tecnologia','8.2k','Como baixar latência em 67% com edge em Luanda'],['ModaAngolana','Moda','6.9k','Upcycling de panos com denim selvedge'],['MufeteDay','Gastronomia','5.1k','Funge, dendê e o ponto da espuma']];
const SU=['u1','u2','u3','u4','u5','u6'].map((u,i)=>({id:'s'+u,u,seen:i>2,time:(i+1)*2+'h',items:[[i%2==0?'Na Ilha agora — 6AM light, sem filtro, só mar':'Novo drop sexta — atelier aberto para prova',i],['Bastidores do estúdio. Nada posado.',(i+2)%12]]}));
const CV=[['c1','u1','Ilha • imprimir?',2],['c2','u2','Atelier 15h',0],['c3','u5','Deck v2',1]];
const hm=()=>new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
const MSG={c1:[[0,'Aquela foto da Ilha ficou absurda. Vamos imprimir grande formato para o Miramar?','10:32'],[1,'Bora. Tenho em 4K + filme já.','10:33']],c2:[[0,'Vou passar no atelier às 15h para ver o denim.','09:10']],c3:[[0,'Enviei o deck da Kilapi v2 — feedback?','08:12']]};
let D;try{D=JSON.parse(localStorage.getItem('ancora.editorial.v1'))}catch{}D=D&&D.posts?D:{posts:[],cm:[],sv:[]};
const sync=()=>{try{localStorage.setItem('ancora.editorial.v1',JSON.stringify(D))}catch{}};
const nd=()=>({title:'',text:'',loc:'',img:'',i:null,poll:false,opts:['','']});
const S={tab:'feed',q:'',create:false,anim:false,busy:false,open:null,cd:'',story:null,seen:new Set(['su2']),chat:false,conv:'c1',d:nd(),toasts:[]};
const all=()=>[...D.posts.map(p=>({id:p.id,u:'u0',title:p.title||p.text.split('\n')[0].slice(0,60)||'Ensaio sem título',text:p.text,i:p.i,img:p.img,loc:p.loc,likes:p.likes,liked:p.liked,cc:0,sh:0,t:'agora',q:'O que acham?',poll:p.poll,own:1})).reverse(),...MP];
const shown=()=>{const a=all(),q=S.q.toLowerCase();return S.tab=='arquivo'?a.filter(p=>D.sv.includes(p.id)):q?a.filter(p=>(p.text+(p.loc||'')+(p.title||'')).toLowerCase().includes(q)):a};
const av=(u,s=28)=>`<span class="serif inline-grid place-items-center rounded-full bg-[var(--text)] text-[var(--bg)] border border-[var(--border)] shrink-0" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.46)}px;letter-spacing:0" title="${esc(u.name)}">${u.name[0]}</span>`;
const toast=(t,d)=>{const id=Math.random();S.toasts.push({id,t,d});R.toasts();setTimeout(()=>{S.toasts=S.toasts.filter(x=>x.id!=id);R.toasts()},3200)};
const NV=[['feed','Feed'],['arquivo','Arquivo'],['estudio','Estúdio'],['msg','Mensagens']];
const act=id=>S.tab==id||(id=='msg'&&S.chat);
const R={
nav(){$('#nav').innerHTML=NV.map(([id,l])=>`<button data-a="${id=='msg'?'chat':'tab'}" data-v="${id=='msg'?1:id}" class="text-[12px] tracking-[0.08em] uppercase font-[500] tr-400 ${act(id)?'text-[var(--text)] underline underline-offset-[6px] decoration-[1.5px]':'text-[var(--text-faint)] hover:text-[var(--text)]'}">${l} ${id=='arquivo'&&D.sv.length?'• '+D.sv.length:''} ${id=='msg'?'• 3':''}</button>`).join('');
$('#tab').innerHTML=`<div class="flex items-center justify-around h-[56px] px-2">${NV.map(([id,l])=>`<button data-a="${id=='msg'?'chat':'tab'}" data-v="${id=='msg'?1:id}" class="text-[11px] tracking-[0.08em] uppercase font-[500] px-3 h-8 rounded-full tr-300 ${act(id)?'ink':'text-[var(--text-faint)]'}">${id=='msg'?'Msgs':l}</button>`).join('')}<button data-a="create" aria-label="Novo ensaio" class="h-9 w-9 rounded-full ink grid place-items-center">${ic('plus',16)}</button></div>`},
left(){const a=all();$('#left').innerHTML=`<div class="lg:sticky lg:top-[100px] px-6 sm:px-0 py-8 lg:py-0 space-y-8">
<div class="space-y-5"><div class="h-[120px] w-[120px] rounded-full overflow-hidden bg-[var(--text)] border border-[var(--border)]">${av(U.u0,120)}</div>
<div><h2 class="serif text-[32px] leading-[0.95] tracking-[-0.04em] font-[400]">Tu —<br><span class="serif-italic">Estúdio</span></h2><p class="label-caps mt-3">EDITOR • LUANDA, AO • ONLINE</p></div>
<p class="news text-[16px] leading-[1.5] text-[var(--text-muted)] max-w-[28ch]">${BIO} O arquivo é vivo. Cada post é um ensaio com foto, não um story.</p></div>
<div class="divider"></div>
<div class="grid grid-cols-3 gap-4"><div><p class="serif text-[28px] leading-none">${D.posts.length+23}</p><p class="label-caps mt-1">Ensaios</p></div><div><p class="serif text-[28px] leading-none">1.2k</p><p class="label-caps mt-1">Seguidores</p></div><div><p class="serif text-[28px] leading-none">${D.sv.length||12}</p><p class="label-caps mt-1">Arquivados</p></div></div>
<div><p class="label-caps mb-3">ARQUIVO VISUAL • 12 FOTOS • 4:3 • 20px</p><div class="grid grid-cols-3 gap-2">${a.slice(0,9).map(p=>`<div class="aspect-square rounded-[12px] overflow-hidden border border-[var(--border)] bg-[var(--surface)] group cursor-pointer">${im(p.img,p.i,'w-full h-full object-cover group-hover:scale-[1.03] tr-400',p.title)}</div>`).join('')}</div><button data-a="tab" data-v="estudio" class="mt-3 label-caps hover:text-[var(--text)] tr-300">VER GRELHA COMPLETA →</button></div>
<div class="divider hidden lg:block"></div>

const closeAll=()=>{S.create=false;S.story=null;S.chat=false;R.modal();R.story();R.chat();R.nav()};
function sendChat(){const i=$('#ci'),t=i.value.trim();if(!t)return;const k=S.conv;(MSG[k]=MSG[k]||[]).push([1,t,hm()]);i.value='';R.chat();setTimeout(()=>{MSG[k].push([0,'Perfeito. Vou arquivar isso no estúdio e te mando a prova às 18h.',hm()]);R.chat()},900)}
function publish(){const d=S.d;if(!d.text.trim()||S.busy)return;S.busy=true;R.modal();setTimeout(()=>{const o=d.opts.filter(x=>x.trim()),i=d.i!=null?d.i:Math.floor(Math.random()*16);D.posts.push({id:'n'+Date.now(),title:d.title||d.text.slice(0,60),text:d.text,loc:d.loc,img:d.img.trim(),i,likes:0,liked:false,poll:d.poll&&o.length>=2?o.map(x=>[x,5+Math.floor(Math.random()*60)]):null});sync();S.busy=false;S.create=false;S.d=nd();S.tab='feed';page();R.modal();toast('Ensaio publicado com foto 800×600')},450)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,id=b.dataset.id,d=S.d;
if(a=='tab'){S.tab=v;S.chat=false;S.open=null;page();R.chat();scrollTo(0,0)}
else if(a=='chat'){S.chat=v=='1';R.chat();R.nav();if(S.chat)setTimeout(()=>$('#ci').focus(),400)}
else if(a=='create')openCreate();else if(a=='close'){S.create=false;R.modal()}
else if(a=='like'){const p=D.posts.find(x=>x.id==id);if(p){p.liked=!p.liked;p.likes=Math.max(0,p.likes+(p.liked?1:-1));sync();R.main()}else toast('Curtiu • arquivo atualizado')}
else if(a=='save'){const k=D.sv.indexOf(id);k<0?D.sv.push(id):D.sv.splice(k,1);sync();page();toast(k<0?'Arquivado • ver em Arquivo':'Removido do arquivo')}
else if(a=='cmt'){S.open=S.open==id?null:id;S.cd='';S.focus=1;R.main()}
else if(a=='send'){const t=S.cd.trim();if(!t)return;D.cm.push({id:'c'+Date.now(),p:id,t,h:hm()});S.cd='';sync();S.focus=1;R.main();toast('Comentário arquivado')}
else if(a=='story'){S.story=[+v,0];S.seen.add(SU[+v].id);R.story();R.right()}
else if(a=='sx'){S.story=null;R.story()}
else if(a=='snext'){const[s,i]=S.story;if(i<SU[s].items.length-1)S.story=[s,i+1];else if(s<SU.length-1){S.story=[s+1,0];S.seen.add(SU[s+1].id)}else S.story=null;R.story();R.right()}
else if(a=='sprev'){const[s,i]=S.story;if(i>0)S.story=[s,i-1];else if(s>0)S.story=[s-1,SU[s-1].items.length-1];R.story()}
else if(a=='conv'){S.conv=v;R.chat()}else if(a=='csend')sendChat();
else if(a=='trend'){const q=$('[data-f=q]');q.value=v;S.q=v;S.tab='feed';page()}
else if(a=='rnd'){d.i=Math.floor(Math.random()*16);d.img='';R.modal();toast(`Imagem ${LB[d.i]} selecionada`)}
else if(a=='clr'){d.i=null;d.img='';R.modal()}else if(a=='pick'){d.i=+v;d.img='';R.modal()}
else if(a=='poll'){d.poll=!d.poll;R.modal()}else if(a=='opta'){d.opts.push('');R.modal()}else if(a=='optx'){d.opts.splice(+v,1);R.modal()}
else if(a=='pub')publish()});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const v=e.target.value,d=S.d;
if(f=='q'){S.q=v;R.main()}else if(f=='cd')S.cd=v;else if(f=='opt')d.opts[+e.target.dataset.i]=v;
else if(f!='chat'){d[f]=v;if(f=='text'){$('#cnt').textContent=v.length+'/280 • 12 IMAGENS REAIS';$('#pub').disabled=!v.trim()}
if(f=='title')$('#pvt').textContent=v||'Preview do ensaio — 800×600 object-cover';
if(f=='img'){d.i=null;const pv=$('#pv');pv.dataset.f='';pv.dataset.s=0;pv.src=v.trim()||art(0)}}});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key=='Escape')closeAll();
else if(e.key=='Enter'){if(t.id=='ci')sendChat();else if(t.id=='cin')t.nextElementSibling.click()}
else if(e.key.toLowerCase()=='n'&&!e.metaKey&&!e.ctrlKey&&!/INPUT|TEXTAREA/.test(t.tagName)&&!S.create){e.preventDefault();openCreate()}});
$('#si').innerHTML=ic('search',13);$('#hav').innerHTML=av(U.u0,32);$('#cx').innerHTML=ic('x');$('#cs').innerHTML=ic('send');
page();R.chat();
</script>
</body>
</html>
