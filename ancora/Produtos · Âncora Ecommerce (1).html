<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Produtos · Âncora Ecommerce</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--line:#e6e9ef;--grid:#e8ebf0;--ink:#161a23;--mute:#8b93a1;--b1:#26b5a6;--b2:#a8ebe2;--bd:#0f8f86;--bl:#e6f8f5;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--card:#131b2a;--line:#233049;--grid:#223049;--ink:#e8edf6;--mute:#8793a8;--bl:#0f2b2a;--bd:#2ec4b0}}
:root[data-theme="dark"]{--bg:#0e1420;--card:#131b2a;--line:#233049;--grid:#223049;--ink:#e8edf6;--mute:#8793a8;--bl:#0f2b2a;--bd:#2ec4b0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;padding:16px}
.wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;max-width:1500px;margin:auto}
@media(max-width:860px){.wrap{grid-template-columns:1fr;gap:24px}}
.chart{position:relative}
.head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 6px;gap:10px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.lg i{width:38px;height:12px;border-radius:3px;background:linear-gradient(90deg,var(--b1),var(--b2))}
.seg{position:relative;display:flex;background:var(--bl);border-radius:999px;padding:3px}
.seg button{position:relative;z-index:1;border:0;background:none;font:600 12px 'DM Sans',sans-serif;color:var(--mute);padding:6px 14px;cursor:pointer;border-radius:999px;transition:color .25s}
.seg button.on{color:#fff}
.seg b{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--bd);transition:transform .35s cubic-bezier(.3,.8,.2,1)}
.seg[data-m="area"] b{transform:translateX(100%)}
svg{width:100%;height:auto;display:block;overflow:visible}
.gl{stroke:var(--grid)}.yt{fill:var(--mute);font-size:11px;text-anchor:end}.xt{fill:var(--ink);font-size:12.5px;text-anchor:middle;font-weight:500}
.bar{transition:y 1.1s cubic-bezier(.2,.8,.2,1),height 1.1s cubic-bezier(.2,.8,.2,1),opacity .25s,filter .25s;cursor:pointer}
.bars:hover .bar{opacity:.5}.bars .bar:hover{opacity:1;filter:drop-shadow(0 8px 12px rgba(15,143,134,.35))}
.vl{fill:var(--bd);font-size:13px;font-weight:700;text-anchor:middle;transition:y 1.1s cubic-bezier(.2,.8,.2,1),opacity .5s}
.avg{stroke:var(--bd);stroke-width:1.5;stroke-dasharray:6 6;opacity:0;transition:opacity .6s 1.2s}
.pill rect{fill:var(--bd)}.pill text{fill:#fff;font-size:11px;font-weight:600;text-anchor:middle}
.pill{opacity:0;transition:opacity .6s 1.3s}
.rv{transition:width 1.6s cubic-bezier(.4,.1,.2,1)}
.ln{fill:none;stroke:var(--bd);stroke-width:3;stroke-linecap:round}
.dot{fill:var(--card);stroke:var(--bd);stroke-width:3;cursor:pointer;transition:r .2s}.dot:hover{r:9}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:8px;opacity:0;transform:translateY(4px);transition:.15s;white-space:nowrap;z-index:5}
.tip.on{opacity:1;transform:none}
.side{display:flex;flex-direction:column;min-height:420px}
.tabs{position:relative;display:flex;justify-content:space-between;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:9px;border:0;background:none;font:500 13.5px 'DM Sans',sans-serif;color:var(--ink);padding:8px 6px;cursor:pointer}
.tab svg{width:20px;height:20px;color:var(--mute);transition:color .25s,transform .25s}
.tab:hover svg,.tab.on svg{color:var(--bd);transform:scale(1.12)}
.tab:focus-visible{outline:2px solid var(--b1);border-radius:8px}
.ind{position:absolute;bottom:-1px;height:2px;background:var(--bd);border-radius:2px;transition:left .4s cubic-bezier(.3,.8,.2,1),width .4s cubic-bezier(.3,.8,.2,1)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--mute);font-size:16px;padding:30px 10px}
.empty .box{animation:fl 3.6s ease-in-out infinite}
.empty p{margin:0;transition:opacity .25s}
@keyframes fl{50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <section class="chart" id="cbox">
    <div class="head"><div class="lg"><i></i>revenue</div>
      <div class="seg" id="seg" data-m="bar"><b></b><button class="on" data-m="bar">Barras</button><button data-m="area">Área</button></div></div>
    <svg id="ch" viewBox="0 0 700 540" role="img" aria-label="Receita por produto"></svg>
    <div class="tip" id="tip"></div>
  </section>

  <section class="side">
    <nav class="tabs" id="tabs">
      <button class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 7H6"/></svg>Meus produtos</button>
      <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>Eliminar produto</button>
      <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6"/><path d="M18.5 3.5a2 2 0 0 1 3 3L12 16l-4 1 1-4z"/></svg>Editar produto</button>
      <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Novo produto</button>
      <span class="ind" id="ind"></span>
    </nav>
    <div class="empty">
      <svg class="box" width="96" height="96" viewBox="0 0 96 96" fill="none" aria-hidden="true">
        <path d="M48 14 82 30v36L48 82 14 66V30z" fill="var(--bl)" stroke="var(--b1)" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M14 30l34 16 34-16M48 46v36" stroke="var(--b1)" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M31 22l34 16" stroke="var(--bd)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 7"/>
      </svg>
      <p id="msg">Você ainda não tem produtos registrados.</p>
    </div>
  </section>
</div>

<script>
const D=[{n:'Computador',v:150},{n:'telefone',v:90},{n:'PlayStation 3',v:187},{n:'Televisor',v:75}];
const NS='http://www.w3.org/2000/svg',s=document.getElementById('ch'),box=document.getElementById('cbox'),tip=document.getElementById('tip');
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const X0=48,X1=690,Y0=30,Y1=490,M=200,H=Y1-Y0,max=Math.max(...D.map(d=>d.v)),avg=D.reduce((a,b)=>a+b.v,0)/D.length;
const yy=v=>Y1-v/M*H;
function show(e,h){const r=box.getBoundingClientRect();tip.innerHTML=h;tip.style.left=Math.min(e.clientX-r.left+12,r.width-140)+'px';tip.style.top=(e.clientY-r.top-40)+'px';tip.classList.add('on')}
function count(t,to,delay){const t0=performance.now()+delay;(function f(n){const p=Math.min(Math.max((n-t0)/1000,0),1);t.textContent=Math.round(to*(1-Math.pow(1-p,4)));p<1&&requestAnimationFrame(f)})(t0)}
function draw(mode){
  s.innerHTML='';const defs=el('defs',{},s);
  [['gb',['#3cc9b8','#a8ebe2'],1],['gm',['#0d8a80','#6fd3c7'],1],['ga',['#26b5a6','#26b5a6'],0]].forEach(([id,c,o])=>{
    const g=el('linearGradient',{id,x1:0,y1:0,x2:0,y2:1},defs);
    el('stop',{offset:0,'stop-color':c[0],'stop-opacity':o?1:.45},g);el('stop',{offset:1,'stop-color':c[1],'stop-opacity':o?.85:0},g)});
  const cp=el('clipPath',{id:'cl'},defs);el('rect',{x:0,y:0,width:700,height:Y1},cp);
  const rc=el('clipPath',{id:'rv'},defs),rr=el('rect',{class:'rv',x:0,y:0,width:mode==='area'?0:700,height:540},rc);
  for(let v=0;v<=M;v+=20){const y=yy(v);el('line',{class:'gl',x1:X0,x2:X1,y1:y,y2:y,'stroke-dasharray':v?'3 6':'0'},s);el('text',{class:'yt',x:X0-9,y:y+4},s).textContent=v}
  const w=(X1-X0)/D.length,bw=Math.min(120,w*.7),cx=i=>X0+w*(i+.5);
  D.forEach((d,i)=>{el('text',{class:'xt',x:cx(i),y:Y1+26},s).textContent=d.n});
  const vl=D.map((d,i)=>{const t=el('text',{class:'vl',x:cx(i),y:Y1-8,opacity:0},s);t.textContent=0;return t});
  const hit=(e,d)=>show(e,`<b>${d.n}</b><br>${d.v} · ${Math.round(d.v/D.reduce((a,b)=>a+b.v,0)*100)}% do total`);
  if(mode==='bar'){
    const g=el('g',{class:'bars','clip-path':'url(#cl)'},s);
    D.forEach((d,i)=>{const h=d.v/M*H,r=el('rect',{class:'bar',x:cx(i)-bw/2,y:Y1,width:bw,height:0,rx:14,fill:`url(#${d.v===max?'gm':'gb'})`},g);
      r.onmousemove=e=>hit(e,d);r.onmouseleave=()=>tip.classList.remove('on');
      setTimeout(()=>{r.setAttribute('y',Y1-h);r.setAttribute('height',h+16);vl[i].setAttribute('y',Y1-h-12);vl[i].setAttribute('opacity',1);count(vl[i],d.v,0)},150+i*130)});
  }else{
    const P=D.map((d,i)=>[cx(i),yy(d.v)]);let p=`M${P[0]}`;
    for(let i=1;i<P.length;i++){const m=(P[i-1][0]+P[i][0])/2;p+=` C${m},${P[i-1][1]} ${m},${P[i][1]} ${P[i]}`}
    const g=el('g',{'clip-path':'url(#rv)'},s);
    el('path',{d:p+` L${P[P.length-1][0]},${Y1} L${P[0][0]},${Y1}Z`,fill:'url(#ga)'},g);el('path',{class:'ln',d:p},g);
    P.forEach((q,i)=>{const c=el('circle',{class:'dot',cx:q[0],cy:q[1],r:6},s);c.onmousemove=e=>hit(e,D[i]);c.onmouseleave=()=>tip.classList.remove('on');
      vl[i].setAttribute('y',q[1]-16);setTimeout(()=>{vl[i].setAttribute('opacity',1);count(vl[i],D[i].v,0)},500+i*350)});
    requestAnimationFrame(()=>requestAnimationFrame(()=>rr.setAttribute('width',700)));
  }
  const ya=yy(avg),a=el('line',{class:'avg',x1:X0,x2:X1,y1:ya,y2:ya},s),pl=el('g',{class:'pill'},s);
  el('rect',{x:X1-92,y:ya-11,width:92,height:22,rx:11},pl);el('text',{x:X1-46,y:ya+4},pl).textContent='média '+avg.toLocaleString('pt-PT');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{a.style.opacity=.8;pl.style.opacity=1}));
}
const seg=document.getElementById('seg');
seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{seg.dataset.m=b.dataset.m;seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));draw(b.dataset.m)});
draw('bar');

const tabs=[...document.querySelectorAll('.tab')],ind=document.getElementById('ind'),msg=document.getElementById('msg');
const T=['Você ainda não tem produtos registrados.','Não há produtos para eliminar.','Não há produtos para editar.','Comece por registar o seu primeiro produto.'];
function mv(t){ind.style.left=t.offsetLeft+'px';ind.style.width=t.offsetWidth+'px'}
tabs.forEach((t,i)=>t.onclick=()=>{tabs.forEach(x=>x.classList.toggle('on',x===t));mv(t);msg.style.opacity=0;setTimeout(()=>{msg.textContent=T[i];msg.style.opacity=1},200)});
const sync=()=>mv(tabs.find(t=>t.classList.contains('on')));
document.fonts&&document.fonts.ready.then(sync);addEventListener('resize',sync);sync();
</script>
</body>
</html>
